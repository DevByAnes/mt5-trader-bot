[package]
name = "xauusd-operations-console"
version = "0.1.0"
description = "Local XAUUSD operations dashboard"
edition = "2021"
[lib]
name = "xauusd_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }
[dependencies]
tauri = { version = "2.12.3", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
zeroize = "1"
