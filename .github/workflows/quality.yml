name: Quality and contract
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm contract:check && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: python -m pip install uv==0.13.6
      - run: python -m uv sync --project backend --frozen --managed-python
      - run: pnpm test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results
