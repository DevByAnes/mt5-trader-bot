name: Python bridge and contract
on: [push, pull_request]
jobs:
  backend:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install uv==0.13.6
      - run: python -m uv sync --frozen --managed-python
      - run: python -m uv run python -c "import sys, sqlite3; print(sys.version); print('SQLite', sqlite3.sqlite_version)"
      - run: python -m uv run aurum-lint
      - run: python -m uv run mypy
      - run: python -m uv run python -m tools.gen_models --check
      - run: python -m uv run python -m tools.shared_settings --check
      - run: python -m uv run pytest -q
      - run: python -m uv run python -m tools.guard_demo
      - run: python -m uv run python -m tools.smoke
